version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Europe/Amsterdam

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Europe/Amsterdam

  - package-ecosystem: gradle
    directories:
      - /android
      - /example/android
    groups:
      android-build-tooling:
        patterns:
          - "com.android*"
          - "org.jetbrains.kotlin*"
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Europe/Amsterdam
